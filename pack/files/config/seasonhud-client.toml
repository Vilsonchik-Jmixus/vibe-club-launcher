#Enable the mod?
enable_mod = true
#Where to display the Hud when no minimap is installed.
hud_location = "TOP_LEFT"
hud_x_position = 2
hud_y_position = 2
hud_scale = 1.0

[Colors]
	#Display the season name in a color? (Vibe Club: да, цвет сезона)
	season_name_color = true
	spring_color = 16753595
	summer_color = 16705834
	autumn_color = 16747040
	winter_color = 9230335
	dry_color = 16745216
	wet_color = 2068975

[Season]
	enable_show_tropical_season = false
	#Vibe Club: «Поздняя осень», «Ранняя зима» и т.д.
	enable_show_sub_season = true
	#Vibe Club: сезон идёт по реальному календарю, номер дня сезона не показываем
	enable_show_day = "NONE"
	enable_show_fertility = false
	enable_fertility_replaces_season = false

[Minimap]
	#Vibe Club: строка сезона под картой Xaero's Minimap
	enable_minimap_integration = true
	enable_show_minimap_hidden = true
