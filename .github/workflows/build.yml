name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build Windows exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o VibeClubLauncher.exe .
      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o VibeClubLauncher-linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: VibeClubLauncher
          path: |
            VibeClubLauncher.exe
            VibeClubLauncher-linux-x64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VibeClubLauncher.exe
            VibeClubLauncher-linux-x64
